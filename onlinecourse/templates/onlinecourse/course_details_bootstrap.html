<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ course.name }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 class="card-title">
                {{ course.name }}
            </h1>

            <p class="card-text">
                {{ course.description }}
            </p>

            <hr>

            <h3>Lessons</h3>

            <div class="list-group mt-3">

                {% for lesson in course.lessons.all %}

                    <div class="list-group-item">
                        <h5 class="mb-1">
                            {{ lesson.title }}
                        </h5>

                        <p class="mb-1">
                            {{ lesson.content }}
                        </p>
                    </div>

                {% empty %}

                    <div class="alert alert-info">
                        No lessons available.
                    </div>

                {% endfor %}

            </div>

            <div class="mt-4">
                <a href="{% url 'exam' course.id %}" class="btn btn-primary">
                    Take Exam
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
